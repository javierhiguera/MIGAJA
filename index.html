<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Migaja · Milanesas caseras</title>
<meta name="description" content="Milanesas de pollo caseras, listas para freír. Armá tu pedido y recibí el resumen por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#">La Migaja</a>
  <nav><a href="#catalogo">Catálogo</a><a href="#info">Cómo comprar</a><a href="#info">Entregas</a><a href="#info">Contacto</a></nav>
  <div class="acts">
    <button id="tema" class="ib" type="button" aria-label="Cambiar tema">◐</button>
    <button id="cartBtn" class="ib" type="button" aria-label="Abrir carrito"><span id="ic"></span><b id="cnt">0</b></button>
  </div>
</header>

<section class="hero">
  <img id="heroImg" src="img/hero.jpg" alt="Milanesas de pollo caseras crudas, listas para freír">
  <div class="hero-t">
    <h1>Milanesas caseras, listas para freír.</h1>
    <p>Elegí tus favoritas, armá tu pedido y coordinamos la entrega.</p>
    <a class="btn y" href="#catalogo">Ver catálogo</a>
  </div>
</section>

<main>
  <section id="catalogo" class="sec"><h2>Catálogo</h2>
    <input id="q" type="search" placeholder="Buscar milanesas" aria-label="Buscar milanesas">
    <div id="chips" class="chips"></div>
    <div id="lista" class="grid"></div>
  </section>
  <section id="info" class="sec"><h2>Información</h2><div id="infoBody" class="info"></div></section>
</main>

<div id="bar" class="bar" hidden><button id="barBtn" type="button"></button></div>
<div id="ov" class="ov" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pt">
    <div class="ph"><h2 id="pt"></h2><button class="ib" id="x" type="button" aria-label="Cerrar"></button></div>
    <div id="pb"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/productos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
